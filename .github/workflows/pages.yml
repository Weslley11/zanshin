name: Publicar app no GitHub Pages (PWA)

# Publica a versão web/PWA (modo local, sem servidor) em https://<usuario>.github.io/<repositorio>/
# Pré-requisito único: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build do PWA (modo local, sem EXPO_PUBLIC_API_URL)
        run: npm run build:pwa
        env:
          FLUENT_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_APP_VERSION: ${{ github.sha }}
      # Áudios gravados (voz neural Piper, LJSpeech — domínio público): tocam como mídia, de forma confiável no iPhone
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache dos áudios e da voz
        uses: actions/cache@v4
        with:
          path: |
            mobile/.audio-cache
            mobile/voices
          key: audio-${{ hashFiles('mobile/src/content/content.json', 'mobile/scripts/make_audio.py') }}
          restore-keys: audio-
      - name: Gerar áudios das frases
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install piper-tts==1.8.0
          [ -f voices/en_US-ljspeech-medium.onnx ] || python -m piper.download_voices en_US-ljspeech-medium --data-dir voices
          python scripts/make_audio.py --model voices/en_US-ljspeech-medium.onnx --out .audio-cache
          mkdir -p dist/audio && cp .audio-cache/* dist/audio/
          ls dist/audio | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
